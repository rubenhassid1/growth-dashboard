name: Sync from Google Sheet

on:
  schedule:
    # Every Monday at 08:00 UTC (11:00 Israel time) — after weekend update
    - cron: '0 8 * * 1'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync from Google Sheet
        run: python scripts/sync-sheet.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/counts.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: sync from Google Sheet $(date -u +%Y-%m-%d)"
            git push
          fi
