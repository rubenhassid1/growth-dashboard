name: Daily follower count scrape

on:
  schedule:
    # Every day at 23:59 Israel time (20:59 UTC during summer / 21:59 UTC during winter)
    - cron: '59 20 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/scrape.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/counts.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: daily follower counts $(date -u +%Y-%m-%d)"
            git push
          fi
